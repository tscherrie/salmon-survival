# Paketierung (electron-builder). Aufruf über die Skripte im Wurzel-package.json (npm run dist, dist:dir, dist:mac,
# dist:win), die scripts/dist.mjs nutzen: bauen → Staging (scripts/stage-app.mjs) → electron-builder → Prüfung
# (scripts/verify-app.mjs). dist.mjs ergänzt zur Laufzeit electronVersion/electronDist, die Architektur des
# Build-Rechners und die macOS-Signierung (ad hoc „-“ ohne Developer ID; mit CSC_LINK/CSC_NAME echte Signierung,
# mit APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID bzw. APPLE_API_KEY zusätzlich Notarisierung).
appId: studio.director.desktop
# Muss der installierten Electron-Version entsprechen (Test: test-main/packaging.test.ts); dist.mjs setzt sie ohnehin
# aus node_modules/electron. Steht hier, damit auch ein direkter Aufruf von electron-builder funktioniert.
electronVersion: 44.5.1
productName: Director Studio
copyright: Copyright © 2026 Director Studio
# Icons (build/icon.icns, build/icon.ico, build/icons/) erzeugt scripts/make-icons.mjs aus build/icon.svg.
directories:
  output: release
  buildResources: build
  # Staging-Ordner: package.json ohne dependencies + out/ (siehe scripts/stage-app.mjs).
  app: dist/stage/app
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
# Keine Node-Module im asar: Die Laufzeitpakete liegen als resources/node_modules daneben (extraResources unten).
# Remotion (webpack, Compositor), esbuild und der Claude-Agent-SDK starten Binaries über echte Dateipfade.
npmRebuild: false
nodeGypRebuild: false
extraResources:
  # Laufzeitpakete in den Versionen des Lockfiles, nur mit den Plattform-Binaries des Build-Rechners.
  - from: dist/stage/node_modules
    to: node_modules
    filter: ["**/*"]
  # Optional: eigene ffmpeg/ffprobe-Builds je Plattform (LGPL, OS-Encoder) – siehe docs/director-studio/PLAN.md 19a.
  # Fehlt der Ordner, warnt electron-builder nur („file source doesn't exist“); die App sucht ffmpeg dann im System.
  - from: vendor/ffmpeg/${os}-${arch}
    to: ffmpeg
    filter: ["**/*"]
  # Lizenztexte der mitgelieferten Schriften (SIL OFL 1.1: Instrument Sans, IBM Plex Mono) – siehe DESIGN.md §4.2.
  # Die woff2-Dateien selbst bündelt Vite unverändert in out/renderer/assets.
  - from: src/renderer/assets/fonts
    to: licenses/fonts
    filter: ["OFL-*.txt"]
mac:
  category: public.app-category.video
  # Architektur setzt dist.mjs (Build-Rechner); die nativen Pakete stammen von dort.
  target: [dmg]
  hardenedRuntime: true
  # Signatur-Identität setzt dist.mjs: ohne CSC_LINK/CSC_NAME ad hoc („-“), sonst die Developer ID.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: "Push-to-Talk: Director Studio nimmt deine Sprachanweisungen nur auf, solange du die Taste hältst."
dmg:
  artifactName: "Director-Studio-${version}-${arch}.${ext}"
win:
  target: [nsis]
  # Ohne Zertifikat (CSC_LINK/WIN_CSC_LINK) bleibt der Installer unsigniert – SmartScreen warnt dann (README).
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Director Studio
  artifactName: "Director-Studio-Setup-${version}-${arch}.${ext}"
linux:
  # Nur für die Prüfung der Paketierung unter Linux (keine Zielplattform des Produkts).
  target: [tar.gz]
  icon: build/icons
  category: Video
  executableName: director-studio
publish: null
